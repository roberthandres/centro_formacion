<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Aprendiz</title>
    <style>
        body{font-family:Segoe UI;background:#f1f5f9;padding:40px}
        .card{background:white;padding:25px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 5px 20px rgba(0,0,0,.05)}
        .btn-si{background:#dc2626;color:white;padding:10px 15px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
        .btn-no{padding:10px 15px;text-decoration:none;color:#334155;margin-left:10px}
    </style>
</head>
<body>
<div class="card">
    <h2>¿Eliminar a {{ aprendiz.nombre }} {{ aprendiz.apellido }}?</h2>
    <p>Documento: <b>{{ aprendiz.documento }}</b> - Esta acción no se puede deshacer.</p>
    <form method="POST" style="margin-top:20px">
        {% csrf_token %}
        <button type="submit" class="btn-si">Sí, eliminar</button>
        <a href="{% url 'listar_aprendices' %}" class="btn-no">Cancelar</a>
    </form>
</div>
</body>
</html>
