
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        h1 {
            color: #12356b;
            font-size: 30px;
            margin-bottom: 25px;
            text-align: center;
        }

        form {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-top: 5px solid #2563eb;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        form input:not([type="checkbox"]),
        form select,
        form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            background: #16a34a;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #15803d;
            transform: translateY(-2px);
        }

        a {
            display: inline-block;
            margin-left: 12px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }

            form {
                padding: 22px;
            }

            button {
                width: 100%;
            }

            a {
                display: block;
                text-align: center;
                margin: 18px 0 0;
            }
        }
    </style>
</head>

<body>
    <h1>{{ titulo }}</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Guardar cambios</button>

        <a href="{% url 'listar_aprendices' %}">Cancelar</a>
    </form>
</body>
</html>
