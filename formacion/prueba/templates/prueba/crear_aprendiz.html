{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear nuevo aprendiz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #164e63, #0f766e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .contenedor {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .icono {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background: #ccfbf1;
            color: #0f766e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            color: #0f172a;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .encabezado p {
            color: #64748b;
            font-size: 14px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #0d9488;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        form input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #0d9488;
            vertical-align: middle;
            margin-right: 8px;
        }

        .ayuda {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-top: 5px;
        }

        .botones {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button,
        .btn-volver {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button {
            border: none;
            background: #0f766e;
            color: white;
        }

        button:hover {
            background: #115e59;
            transform: translateY(-2px);
        }

        .btn-volver {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-volver:hover {
            background: #e2e8f0;
        }

        .pie {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 500px) {
            .contenedor {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .botones {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">
            <div class="icono">🎓</div>
            <h1>Registrar aprendiz</h1>
            <p>Completa los datos para registrar un nuevo aprendiz.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="botones">
                <button type="submit">✓ Guardar aprendiz</button>

                <a href="{% url 'listar_aprendices' %}"
                   class="btn-volver">
                    ← Volver al listado
                </a>
            </div>
        </form>

        <div class="pie">
            Sistema de Gestión de Aprendices
        </div>

    </div>

</body>
</html>
